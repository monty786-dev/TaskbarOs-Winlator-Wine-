name: Build WinShell

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build 64-bit exe
        run: |
          mkdir -p build
          x86_64-w64-mingw32-gcc -O2 -Wall -municode -mwindows -static-libgcc \
            -o build/WinShell_x64.exe src/winshell.c \
            -lgdi32 -luser32 -lshell32 -lole32 -luuid -lcomctl32 -lcomdlg32 \
            -lshlwapi -ladvapi32 -lgdiplus -lkernel32

      - name: Build 32-bit exe
        run: |
          i686-w64-mingw32-gcc -O2 -Wall -municode -mwindows -static-libgcc \
            -o build/WinShell_x86.exe src/winshell.c \
            -lgdi32 -luser32 -lshell32 -lole32 -luuid -lcomctl32 -lcomdlg32 \
            -lshlwapi -ladvapi32 -lgdiplus -lkernel32

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinShell
          path: build/*.exe

      - name: Publish release (only on tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.exe
